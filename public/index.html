<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase Board</title>
<style>
  :root { --bg:#f4f5f7; --panel:#ebecf0; --card:#fff; --text:#172b4d; --muted:#6b778c; --accent:#0c66e4; --ok:#1f845a; --line:#dfe1e6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d2125; --panel:#161a1d; --card:#22272b; --text:#c7d1db; --muted:#8c9bab; --accent:#579dff; --ok:#4bce97; --line:#38414a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:8px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  button, select, input, textarea { font:inherit; color:inherit; }
  button { background:var(--card); border:1px solid var(--line); border-radius:4px; padding:5px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.link { border:0; background:none; color:var(--muted); padding:2px 6px; }
  input, select, textarea { background:var(--card); border:1px solid var(--line); border-radius:4px; padding:5px 8px; }
  /* major phase tabs */
  #tabs { display:flex; gap:4px; padding:8px 16px 0; border-bottom:1px solid var(--line); overflow-x:auto; overflow-y:hidden; flex:none; }
  .tab { display:flex; align-items:center; gap:2px; padding:4px 8px; border:1px solid transparent; border-bottom:0; border-radius:6px 6px 0 0; margin-bottom:-1px; color:var(--muted); cursor:pointer; white-space:nowrap; }
  .tab:hover { color:var(--text); }
  .tab.active { background:var(--panel); border-color:var(--line); color:var(--text); cursor:default; }
  .tab.over { outline:2px dashed var(--accent); }
  .tab span.name { padding:2px 4px; font-weight:500; }
  .tab input { font-weight:600; background:transparent; border-color:transparent; padding:2px 4px; }
  .tab input:focus { background:var(--card); border-color:var(--line); }
  .addtab { align-self:center; margin-left:4px; }
  /* stages: vertical rows, cards flow left to right */
  #board { flex:1; display:flex; flex-direction:column; gap:10px; padding:16px; overflow-y:auto; }
  .stage { display:flex; background:var(--panel); border-radius:6px; flex:none; }
  .stage.over { outline:2px dashed var(--accent); }
  .stage-head { width:190px; flex:none; display:flex; flex-direction:column; gap:2px; padding:8px; border-right:1px solid var(--line); }
  .stage-head input { font-weight:600; background:transparent; border-color:transparent; width:100%; }
  .stage-head input:focus { background:var(--card); border-color:var(--line); }
  .tools { display:flex; align-items:center; padding-left:8px; }
  .tools .count { margin-right:auto; }
  .count { color:var(--muted); font-size:12px; }
  .cards { flex:1; display:flex; flex-wrap:wrap; align-content:flex-start; gap:8px; padding:8px; min-height:64px; }
  .card { width:210px; flex:none; background:var(--card); border-radius:4px; padding:8px 10px; box-shadow:0 1px 1px rgba(0,0,0,.2); cursor:grab; }
  .card.dragging { opacity:.4; }
  .card .title { font-weight:500; }
  .meta { display:flex; gap:6px; margin-top:6px; align-items:center; color:var(--muted); font-size:12px; }
  .prio { padding:0 6px; border-radius:8px; border:1px solid var(--line); }
  .prio.high { color:#c9372c; border-color:#c9372c; }
  .prio.low { color:var(--ok); border-color:var(--ok); }
  .bar { flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--ok); }
  .add { text-align:left; background:transparent; border-color:transparent; color:var(--muted); }
  .newstage { align-self:flex-start; flex:none; }
  /* modal */
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:flex-start; justify-content:center; padding-top:6vh; }
  #modal.open { display:flex; }
  .dialog { background:var(--bg); border-radius:8px; width:min(560px, 94vw); max-height:88vh; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .dialog label { font-size:12px; color:var(--muted); display:block; margin-bottom:2px; }
  .dialog input, .dialog textarea, .dialog select { width:100%; }
  .row { display:flex; gap:8px; }
  .row > div { flex:1; }
  .tp { display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:4px 6px; }
  .tp input[type=text] { flex:1; border:0; background:transparent; }
  .tp.done input[type=text] { text-decoration:line-through; color:var(--muted); }
  .tp input[type=checkbox] { width:auto; }
</style>
</head>
<body>
<header>
  <h1>Phase Board</h1>
  <select id="projectSel"></select>
  <button id="newProject">+ Project</button>
  <button id="renameProject">Rename</button>
  <button id="delProject" class="link">Delete project</button>
</header>
<nav id="tabs"></nav>
<div id="board"></div>

<div id="modal"><div class="dialog" id="dialog"></div></div>

<script>
// Data shape: project { majorPhases: [{ id, name, stages: [{ id, name }] }], tasks: [{ id, stageId, phases: [...] , ... }] }
const uid = () => Math.random().toString(36).slice(2, 9);
let state = { projects: [] };
let currentId = localStorage.getItem('currentProject');

// ---------- persistence (debounced whole-state save) ----------
let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => fetch('/api/state', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state)
  }), 250);
}
const project = () => state.projects.find(p => p.id === currentId) || state.projects[0];

// Old shape had project.phases (board columns) and task.phaseId: those become the stages of one major phase.
function migrate(s) {
  let changed = false;
  for (const p of s.projects) {
    if (p.majorPhases) continue;
    p.majorPhases = [{ id: uid(), name: 'Phase 1', stages: p.phases || [] }];
    for (const t of p.tasks) { t.stageId = t.phaseId; delete t.phaseId; }
    delete p.phases;
    changed = true;
  }
  return changed;
}

// selected major phase, remembered per project
const majorKey = p => 'currentMajor:' + p.id;
const currentMajor = () => {
  const p = project(), id = localStorage.getItem(majorKey(p));
  return p.majorPhases.find(m => m.id === id) || p.majorPhases[0];
};
const setMajor = m => localStorage.setItem(majorKey(project()), m.id);

// ---------- tiny DOM helper ----------
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k in el) el[k] = v;
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid);
  return el;
}

const progress = t => t.phases.length ? t.phases.filter(p => p.done).length / t.phases.length : 0;

// ---------- header ----------
function renderHeader() {
  const sel = document.getElementById('projectSel');
  sel.replaceChildren(...state.projects.map(p => h('option', { value: p.id, selected: p.id === project()?.id }, p.name)));
}

// ---------- tabs + board ----------
let dragId = null;
function render() {
  renderHeader();
  const tabs = document.getElementById('tabs'), board = document.getElementById('board');
  const p = project();
  if (!p) { tabs.replaceChildren(); board.replaceChildren(h('p', {}, 'No projects. Create one with "+ Project".')); return; }
  const mp = currentMajor();

  tabs.replaceChildren(...p.majorPhases.map(m => tabEl(p, m, m === mp)),
    h('button', { class: 'link addtab', onclick: addMajor }, '+ Major phase'));
  if (!mp) { board.replaceChildren(h('p', {}, 'No major phases. Add one with "+ Major phase".')); return; }

  board.replaceChildren(...mp.stages.map(st => stageEl(p, mp, st)),
    h('button', { class: 'newstage', onclick: () => { mp.stages.push({ id: uid(), name: 'New stage' }); save(); render(); } }, '+ Add stage'));
}

function tabEl(p, m, active) {
  const n = p.tasks.filter(t => m.stages.some(s => s.id === t.stageId)).length;
  const tab = h('div', { class: 'tab' + (active ? ' active' : ''),
    onclick: () => { if (!active) { setMajor(m); render(); } },
    // dropping a card on a tab moves it to that major phase's first stage
    ondragover: e => { if (dragId && m.stages.length) { e.preventDefault(); tab.classList.add('over'); } },
    ondragleave: () => tab.classList.remove('over'),
    ondrop: e => {
      e.preventDefault();
      const t = p.tasks.find(x => x.id === dragId);
      if (!t || !m.stages.length) return;
      moveTask(p, t, m.stages[0].id, null); setMajor(m); save(); render();
    } },
    active
      ? h('input', { value: m.name, size: Math.max(6, m.name.length), onchange: e => { m.name = e.target.value.trim() || m.name; save(); render(); } })
      : h('span', { class: 'name' }, m.name),
    h('span', { class: 'count' }, n),
    active ? [
      h('button', { class: 'link', title: 'Move left', onclick: () => moveIn(p.majorPhases, m, -1) }, '‹'),
      h('button', { class: 'link', title: 'Move right', onclick: () => moveIn(p.majorPhases, m, 1) }, '›'),
      h('button', { class: 'link', title: 'Delete major phase', onclick: () => delMajor(m) }, '✕')] : null);
  return tab;
}

function stageEl(p, mp, st) {
  const tasks = p.tasks.filter(t => t.stageId === st.id);
  const cards = h('div', { class: 'cards' }, tasks.map(cardEl));
  const row = h('div', { class: 'stage',
    ondragover: e => { e.preventDefault(); row.classList.add('over'); },
    ondragleave: () => row.classList.remove('over'),
    ondrop: e => {
      e.preventDefault();
      const t = p.tasks.find(t => t.id === dragId);
      if (!t) return;
      // drop position: before the first card that is on a later line, or on this line with its midpoint right of the cursor
      // (skip the dragged card itself: it is removed from p.tasks in moveTask, so it can't be an anchor)
      const after = [...cards.children].find(c => {
        if (c.dataset.id === t.id) return false;
        const r = c.getBoundingClientRect();
        return e.clientY < r.top || (e.clientY < r.bottom && e.clientX < r.left + r.width / 2);
      });
      moveTask(p, t, st.id, after && p.tasks.find(x => x.id === after.dataset.id));
      save(); render();
    },
  },
    h('div', { class: 'stage-head' },
      h('input', { value: st.name, onchange: e => { st.name = e.target.value.trim() || st.name; save(); } }),
      h('div', { class: 'tools' },
        h('span', { class: 'count' }, tasks.length + (tasks.length === 1 ? ' card' : ' cards')),
        h('button', { class: 'link', title: 'Move up', onclick: () => moveIn(mp.stages, st, -1) }, '↑'),
        h('button', { class: 'link', title: 'Move down', onclick: () => moveIn(mp.stages, st, 1) }, '↓'),
        h('button', { class: 'link', title: 'Delete stage', onclick: () => delStage(mp, st) }, '✕')),
      h('button', { class: 'add', onclick: () => addTask(st) }, '+ Add task')),
    cards);
  return row;
}

function cardEl(t) {
  const pct = progress(t);
  return h('div', { class: 'card', draggable: true, 'data-id': t.id,
    ondragstart: e => { dragId = t.id; e.currentTarget.classList.add('dragging'); },
    ondragend: e => { dragId = null; e.currentTarget.classList.remove('dragging'); },
    onclick: () => openTask(t) },
    h('div', { class: 'title' }, t.title),
    h('div', { class: 'meta' },
      h('span', { class: 'prio ' + t.priority }, t.priority),
      t.phases.length ? [h('div', { class: 'bar' }, h('i', { style: `width:${pct * 100}%` })),
        h('span', {}, `${t.phases.filter(x => x.done).length}/${t.phases.length}`)] : null));
}

function moveTask(p, t, stageId, before) {
  p.tasks.splice(p.tasks.indexOf(t), 1);
  t.stageId = stageId;
  p.tasks.splice(before ? p.tasks.indexOf(before) : p.tasks.length, 0, t);
}
function moveIn(a, x, d) {
  const i = a.indexOf(x), j = i + d;
  if (j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]]; save(); render();
}
function addMajor() {
  const m = { id: uid(), name: 'New phase', stages: ['To do', 'In progress', 'Done'].map(n => ({ id: uid(), name: n })) };
  project().majorPhases.push(m); setMajor(m); save(); render();
}
function delMajor(m) {
  const p = project(), ids = new Set(m.stages.map(s => s.id)), n = p.tasks.filter(t => ids.has(t.stageId)).length;
  if (!confirm(`Delete major phase "${m.name}", its ${m.stages.length} stage(s) and ${n} task(s)?`)) return;
  p.majorPhases = p.majorPhases.filter(x => x !== m);
  p.tasks = p.tasks.filter(t => !ids.has(t.stageId));
  save(); render();
}
function delStage(mp, st) {
  const p = project(), n = p.tasks.filter(t => t.stageId === st.id).length;
  if (n && !confirm(`Delete stage "${st.name}" and its ${n} task(s)?`)) return;
  mp.stages = mp.stages.filter(x => x !== st);
  p.tasks = p.tasks.filter(t => t.stageId !== st.id);
  save(); render();
}
function addTask(st) {
  const t = { id: uid(), title: 'New task', description: '', stageId: st.id, priority: 'medium', phases: [] };
  project().tasks.push(t); save(); render(); openTask(t);
}

// ---------- task modal (including the task's own phases) ----------
const modal = document.getElementById('modal'), dialog = document.getElementById('dialog');
modal.addEventListener('mousedown', e => { if (e.target === modal) closeTask(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTask(); });
function closeTask() { modal.classList.remove('open'); render(); }

function openTask(t) {
  const p = project();
  const phasesBox = h('div', { style: 'display:flex;flex-direction:column;gap:4px' });
  const drawPhases = () => {
    phasesBox.replaceChildren(...t.phases.map((tp, i) =>
      h('div', { class: 'tp' + (tp.done ? ' done' : '') },
        h('input', { type: 'checkbox', checked: tp.done, onchange: e => { tp.done = e.target.checked; save(); drawPhases(); } }),
        h('input', { type: 'text', value: tp.name, onchange: e => { tp.name = e.target.value; save(); } }),
        h('button', { class: 'link', onclick: () => { if (i) { [t.phases[i - 1], t.phases[i]] = [t.phases[i], t.phases[i - 1]]; save(); drawPhases(); } } }, '↑'),
        h('button', { class: 'link', onclick: () => { t.phases.splice(i, 1); save(); drawPhases(); } }, '✕'))));
  };
  drawPhases();
  const newPhase = h('input', { placeholder: 'Add a phase to this task and press Enter',
    onkeydown: e => { if (e.key === 'Enter' && e.target.value.trim()) {
      t.phases.push({ id: uid(), name: e.target.value.trim(), done: false });
      e.target.value = ''; save(); drawPhases(); } } });

  dialog.replaceChildren(
    h('input', { value: t.title, style: 'font-size:16px;font-weight:600', oninput: e => { t.title = e.target.value; save(); } }),
    h('div', { class: 'row' },
      h('div', {}, h('label', {}, 'Stage'),
        // the board follows the card if it moves to another major phase
        h('select', { onchange: e => { t.stageId = e.target.value; setMajor(p.majorPhases.find(m => m.stages.some(s => s.id === t.stageId))); save(); } },
          p.majorPhases.map(m => h('optgroup', { label: m.name },
            m.stages.map(s => h('option', { value: s.id, selected: s.id === t.stageId }, s.name)))))),
      h('div', {}, h('label', {}, 'Priority'),
        h('select', { onchange: e => { t.priority = e.target.value; save(); } },
          ['low', 'medium', 'high'].map(v => h('option', { value: v, selected: v === t.priority }, v))))),
    h('div', {}, h('label', {}, 'Description'),
      h('textarea', { rows: 4, value: t.description, oninput: e => { t.description = e.target.value; save(); } })),
    h('div', {}, h('label', {}, 'Task phases (steps this task moves through)'), phasesBox, newPhase),
    h('div', { class: 'row', style: 'justify-content:space-between' },
      h('button', { onclick: () => { if (confirm('Delete this task?')) { p.tasks = p.tasks.filter(x => x !== t); save(); closeTask(); } } }, 'Delete task'),
      h('button', { class: 'primary', onclick: closeTask }, 'Done')));
  modal.classList.add('open');
}

// ---------- project controls ----------
document.getElementById('projectSel').onchange = e => { currentId = e.target.value; localStorage.setItem('currentProject', currentId); render(); };
document.getElementById('newProject').onclick = () => {
  const name = prompt('Project name?'); if (!name) return;
  const p = { id: uid(), name, tasks: [], majorPhases: [{ id: uid(), name: 'Phase 1',
    stages: ['To do', 'In progress', 'Done'].map(n => ({ id: uid(), name: n })) }] };
  state.projects.push(p); currentId = p.id; localStorage.setItem('currentProject', currentId); save(); render();
};
document.getElementById('renameProject').onclick = () => {
  if (!project()) return;
  const name = prompt('New name?', project().name); if (name) { project().name = name; save(); render(); }
};
document.getElementById('delProject').onclick = () => {
  const cur = project(); if (!cur) return;
  if (!confirm(`Delete project "${cur.name}" and all its tasks?`)) return;
  state.projects = state.projects.filter(p => p !== cur); currentId = state.projects[0]?.id; save(); render();
};

fetch('/api/state').then(r => r.json()).then(s => { state = s; if (migrate(state)) save(); render(); });
</script>
</body>
</html>
