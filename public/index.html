<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase Board</title>
<style>
  :root { --bg:#f4f5f7; --panel:#ebecf0; --card:#fff; --text:#172b4d; --muted:#6b778c; --accent:#0c66e4; --ok:#1f845a; --line:#dfe1e6; --danger:#c9372c; --warn:#a35c00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d2125; --panel:#161a1d; --card:#22272b; --text:#c7d1db; --muted:#8c9bab; --accent:#579dff; --ok:#4bce97; --line:#38414a; --danger:#f87168; --warn:#f5a524; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:8px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  button, select, input, textarea { font:inherit; color:inherit; }
  button { background:var(--card); border:1px solid var(--line); border-radius:4px; padding:5px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.link { border:0; background:none; color:var(--muted); padding:2px 6px; }
  button.danger { background:var(--danger); border-color:var(--danger); color:#fff; }
  input, select, textarea { background:var(--card); border:1px solid var(--line); border-radius:4px; padding:5px 8px; }
  input[type=color] { width:32px; height:28px; padding:2px; flex:none; }
  #me { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  #me select { max-width:140px; padding:2px 4px; font-size:12px; }
  #status { font-size:12px; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:10; display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:8px 14px; box-shadow:0 2px 10px rgba(0,0,0,.35); }
  #toast[hidden] { display:none; }
  #toast button { color:var(--accent); font-weight:600; }
  /* done stages and progress */
  .tab-progress { display:inline-flex; align-items:center; gap:4px; font-size:11px; margin-left:4px; }
  .tab-progress .bar { display:inline-block; flex:none; width:36px; min-width:0; }
  .done-toggle { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); padding-left:8px; cursor:pointer; }
  .stage-head .done-toggle input { width:auto; flex:none; }
  .stage.done-stage .stage-head { border-right-color:var(--ok); border-right-width:3px; }
  /* comments */
  .comment { background:var(--card); border:1px solid var(--line); border-radius:4px; padding:6px 8px; display:flex; flex-direction:column; gap:4px; }
  .comment-head { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .comment-tools { margin-left:auto; }
  .comment .comment-body { border:0; background:none; padding:0; min-height:0; }
  /* bin */
  .bin-text { flex:1; min-width:0; overflow-wrap:anywhere; }
  .bin-item button { flex:none; white-space:nowrap; }
  /* bugs */
  .bugs-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; flex:none; }
  .check-inline { display:flex; align-items:center; gap:6px; font-size:13px; cursor:pointer; }
  .card.resolved { opacity:.6; }
  .card.resolved .title { text-decoration:line-through; }
  .badge.resolved-badge { color:var(--ok); border-color:var(--ok); }
  [hidden] { display:none !important; }
  /* card review */
  .tab.review-tab .count { background:var(--line); border-radius:8px; padding:0 6px; }
  .tab.review-tab.has .count { background:var(--accent); color:#fff; }
  .review { display:flex; flex-direction:column; gap:10px; max-width:1100px; }
  .review h3 { margin:6px 0 0; font-size:14px; }
  .review-row { display:flex; gap:14px; align-items:flex-start; background:var(--panel); border-radius:6px; padding:10px; }
  .review-info { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .declined-reason { color:var(--danger); }
  .review-bar { display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; background:color-mix(in srgb, var(--accent) 14%, transparent); border:1px solid var(--accent); border-radius:6px; padding:8px 12px; }
  .review-bar[hidden] { display:none; }
  /* decisions log */
  .decisions { display:flex; flex-direction:column; gap:12px; max-width:1100px; }
  .decision-toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .decision-row { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--s, var(--line)); border-radius:4px; padding:8px 12px; cursor:pointer; }
  .decision-row:hover { border-color:var(--accent); }
  .decision-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; overflow-wrap:anywhere; }
  .deciders { display:flex; gap:2px; }
  .status { --s:#8b8d98; }
  .status.proposed { --s:#f5a524; } .status.accepted { --s:#30a46c; } .status.rejected { --s:#e5484d; } .status.superseded { --s:#8b8d98; }
  .badge.status { border-color:var(--s); color:var(--text); background:color-mix(in srgb, var(--s) 18%, transparent); }
  button.chip.status { --c:var(--s); }
  .banner { background:color-mix(in srgb, #8b8d98 18%, transparent); border:1px solid #8b8d98; border-radius:4px; padding:6px 10px; }
  .banner[hidden] { display:none; }
  /* deadlines and calendar */
  .badge.due.soon { color:var(--warn); border-color:var(--warn); background:color-mix(in srgb, var(--warn) 14%, transparent); font-weight:600; }
  .badge.due.overdue { background:var(--danger); border-color:var(--danger); color:#fff; font-weight:600; }
  .due-pick { display:flex; align-items:center; gap:2px; }
  .tab.cal-tab .count { border-radius:8px; padding:0 6px; }
  .tab.cal-tab.has .count { background:var(--danger); color:#fff; }
  .calendar { display:flex; flex-direction:column; gap:10px; max-width:1400px; }
  .cal-toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .cal-toolbar .month { font-weight:600; font-size:15px; min-width:150px; }
  .seg { display:inline-flex; }
  .seg button { border-radius:0; }
  .seg button:first-child { border-radius:4px 0 0 4px; }
  .seg button:last-child { border-radius:0 4px 4px 0; margin-left:-1px; }
  .seg button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .cal-scroll { overflow-x:auto; }
  .cal-grid { display:grid; grid-template-columns:repeat(7, minmax(100px, 1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:6px; overflow:hidden; min-width:720px; }
  .cal-head { background:var(--panel); padding:4px 8px; font-size:12px; color:var(--muted); font-weight:600; }
  .cal-day { background:var(--card); min-height:100px; padding:4px; display:flex; flex-direction:column; gap:3px; min-width:0; }
  .cal-day.other { background:var(--bg); }
  .cal-day.other .num { opacity:.5; }
  .cal-day.over { outline:2px dashed var(--accent); outline-offset:-2px; }
  .cal-day .num { align-self:flex-start; font-size:12px; font-weight:600; line-height:20px; padding:0 4px; }
  .cal-day.today .num { background:var(--accent); color:#fff; border-radius:10px; padding:0 7px; }
  .cal-chip { font-size:12px; line-height:19px; padding:0 6px; border-radius:3px; border-left:3px solid var(--c); background:color-mix(in srgb, var(--c) 16%, transparent);
              white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:grab; }
  .cal-chip:hover { outline:1px solid var(--accent); }
  .cal-chip.dragging { opacity:.4; }
  .cal-chip.overdue { color:var(--danger); font-weight:600; }
  .cal-chip.finished { opacity:.55; text-decoration:line-through; }
  .cal-day button.link { align-self:flex-start; font-size:11px; padding:0 4px; }
  .agenda { display:flex; flex-direction:column; gap:4px; }
  .agenda h3 { font-size:13px; margin:10px 0 2px; }
  .agenda h3.overdue { color:var(--danger); }
  .agenda-row { display:flex; gap:6px 14px; align-items:center; flex-wrap:wrap; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--cat, var(--line)); border-radius:4px; padding:6px 10px; cursor:pointer; }
  .agenda-row:hover { border-color:var(--accent); border-left-color:var(--cat); }
  .agenda-row.finished { opacity:.6; }
  .agenda-main { flex:1 1 240px; min-width:0; overflow-wrap:anywhere; }
  #status.live { color:var(--ok); }
  #status.offline { color:var(--muted); }
  /* major phase tabs */
  #tabs { display:flex; gap:4px; padding:8px 16px 0; border-bottom:1px solid var(--line); overflow-x:auto; overflow-y:hidden; flex:none; }
  .tab { display:flex; align-items:center; gap:2px; padding:4px 8px; border:1px solid transparent; border-bottom:0; border-radius:6px 6px 0 0; margin-bottom:-1px; color:var(--muted); cursor:pointer; white-space:nowrap; }
  .tab:hover { color:var(--text); }
  .tab.active { background:var(--panel); border-color:var(--line); color:var(--text); cursor:default; }
  .tab.over { outline:2px dashed var(--accent); }
  .tab span.name { padding:2px 4px; font-weight:500; }
  .tab input { font-weight:600; background:transparent; border-color:transparent; padding:2px 4px; }
  .tab input:focus { background:var(--card); border-color:var(--line); }
  .addtab { align-self:center; margin-left:4px; }
  .tab.orphans { margin-left:auto; }
  .tab.orphans .count { background:var(--line); border-radius:8px; padding:0 6px; }
  .tab.orphans.has .count { background:var(--danger); color:#fff; }
  /* drop markers for reordering tabs and stages */
  .drop-before { box-shadow:inset 3px 0 0 var(--accent); }
  .drop-after { box-shadow:inset -3px 0 0 var(--accent); }
  .stage.drop-before { box-shadow:0 -3px 0 var(--accent); }
  .stage.drop-after { box-shadow:0 3px 0 var(--accent); }
  /* tag filter bar */
  #filters { display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:8px 16px 0; flex:none; }
  #filters:empty { display:none; }
  #filters .label { color:var(--muted); font-size:12px; }
  /* stages: vertical rows, cards flow left to right */
  #board { flex:1; display:flex; flex-direction:column; gap:10px; padding:16px; overflow-y:auto; }
  .stage { display:flex; background:var(--panel); border-radius:6px; flex:none; }
  .stage.over { outline:2px dashed var(--accent); }
  .stage-head { width:190px; flex:none; display:flex; flex-direction:column; gap:2px; padding:8px; border-right:1px solid var(--line); }
  .stage-head .name-row { display:flex; align-items:center; }
  .stage-head input { font-weight:600; background:transparent; border-color:transparent; width:100%; min-width:0; }
  .stage-head input:focus { background:var(--card); border-color:var(--line); }
  .grip { cursor:grab; color:var(--muted); padding:0 4px; user-select:none; }
  .tools { display:flex; align-items:center; padding-left:8px; }
  .tools .count { margin-right:auto; }
  .count { color:var(--muted); font-size:12px; }
  .cards { flex:1; display:flex; flex-wrap:wrap; align-content:flex-start; gap:8px; padding:8px; min-height:64px; }
  .card { width:220px; flex:none; background:var(--card); border-radius:4px; border-left:4px solid var(--cat, var(--line)); padding:8px 10px; box-shadow:0 1px 1px rgba(0,0,0,.2); cursor:grab; display:flex; flex-direction:column; gap:5px; }
  .card.dragging { opacity:.4; }
  .card .title { font-weight:500; overflow-wrap:anywhere; }
  .card { position:relative; }
  .card .cat { padding-right:22px; }
  .card-menu { position:absolute; top:2px; right:2px; font-size:16px; line-height:1; padding:2px 6px; opacity:.5; }
  .card:hover .card-menu, .card-menu:focus { opacity:1; }
  /* move-to menu and drag hints */
  #menu { position:fixed; z-index:20; min-width:200px; max-height:70vh; overflow:auto; background:var(--card); border:1px solid var(--line); border-radius:6px; box-shadow:0 4px 16px rgba(0,0,0,.4); padding:4px; display:flex; flex-direction:column; }
  #menu[hidden] { display:none; }
  #menu .menu-title { font-weight:600; padding:4px 8px; }
  #menu .menu-group { font-size:11px; color:var(--muted); padding:6px 8px 2px; text-transform:uppercase; letter-spacing:.04em; }
  #menu button { text-align:left; border:0; background:none; padding:5px 12px; border-radius:4px; }
  #menu button:hover:not(:disabled), #menu button:focus { background:var(--panel); }
  #menu button:disabled { color:var(--muted); cursor:default; }
  #drag-hint { position:fixed; top:8px; left:50%; transform:translateX(-50%); z-index:15; background:var(--accent); color:#fff; border-radius:6px; padding:6px 14px; font-weight:500; pointer-events:none; box-shadow:0 2px 10px rgba(0,0,0,.35); }
  #drag-hint[hidden] { display:none; }
  body.dragging-card .tab.phase-target:not(.active), body.dragging-card .tab.orphans { outline:1px dashed var(--accent); outline-offset:-2px; color:var(--text); }
  .cat { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--c); flex:none; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chip { display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:0 7px; border-radius:9px; border:1px solid var(--c, var(--line));
          background:color-mix(in srgb, var(--c, transparent) 16%, transparent); color:var(--text); white-space:nowrap; line-height:18px; }
  button.chip { cursor:pointer; padding:1px 8px; }
  button.chip.off { background:transparent; opacity:.7; }
  button.chip.on { background:color-mix(in srgb, var(--c) 45%, transparent); font-weight:600; opacity:1; }
  .meta { display:flex; gap:6px; align-items:center; color:var(--muted); font-size:12px; flex-wrap:wrap; }
  .badge { padding:0 6px; border-radius:8px; border:1px solid var(--line); font-size:11px; line-height:17px; }
  .prio.urgent { background:var(--danger); border-color:var(--danger); color:#fff; font-weight:600; }
  .prio.high { color:var(--danger); border-color:var(--danger); }
  .prio.low { color:var(--ok); border-color:var(--ok); }
  .bar { flex:1; min-width:40px; height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--ok); }
  .add { text-align:left; background:transparent; border-color:transparent; color:var(--muted); }
  .newstage { align-self:flex-start; flex:none; }
  .from { color:var(--muted); font-size:12px; }
  .hint { color:var(--muted); font-size:12px; padding:0 4px; margin:0; }
  /* modal */
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:flex-start; justify-content:center; padding-top:5vh; }
  #modal.open { display:flex; }
  .dialog { background:var(--bg); border-radius:8px; width:min(600px, 94vw); max-height:90vh; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .dialog.card-view { width:min(900px, 95vw); }
  .dialog.decision-view { width:min(1100px, 96vw); max-height:94vh; }
  .dialog.decision-view textarea[rows="22"] { font-family:ui-monospace, Consolas, monospace; font-size:13px; }
  .dialog.files-over { outline:2px dashed var(--accent); }
  .dialog label { font-size:12px; color:var(--muted); display:block; margin-bottom:2px; }
  .dialog input, .dialog textarea, .dialog select { width:100%; }
  .dialog input[type=checkbox] { width:auto; }
  .dialog input[type=color] { width:32px; }
  .dialog h2 { font-size:16px; margin:0; }
  .dialog h3 { font-size:14px; margin:6px 0 0; }
  .dialog p { margin:0; }
  .dialog .check.default-cat { font-size:12px; color:var(--muted); white-space:nowrap; flex:none; }
  .dialog .check { display:flex; align-items:center; gap:6px; font-size:14px; color:var(--text); cursor:pointer; }
  .row { display:flex; gap:8px; align-items:flex-end; }
  .row > div { flex:1; min-width:0; }
  .field-head { display:flex; align-items:center; justify-content:space-between; }
  .field-head label { margin:0; }
  .step, .item { display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:4px 6px; }
  .step input[type=text], .item input[type=text] { flex:1; border:0; background:transparent; }
  .step { align-items:flex-start; }
  .step > input[type=checkbox] { margin-top:7px; }
  textarea.wrap { resize:none; overflow:hidden; line-height:1.4; }
  .step textarea.wrap { flex:1; min-width:0; border:0; background:transparent; padding:4px 6px; }
  .step.done textarea.wrap { text-decoration:line-through; color:var(--muted); }
  .list { display:flex; flex-direction:column; gap:4px; }
  .tag-edit { display:flex; flex-wrap:wrap; gap:4px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:4px; }
  .tag-edit input { flex:1; min-width:120px; border:0; width:auto; }
  .chip button { border:0; background:none; padding:0; color:var(--muted); cursor:pointer; }
  /* markdown */
  .md { background:var(--card); border:1px solid var(--line); border-radius:4px; padding:6px 10px; min-height:40px; overflow-wrap:anywhere; }
  .md:empty::before { content:'No description'; color:var(--muted); }
  .md.editable { cursor:text; }
  .md.editable:hover { border-color:var(--accent); }
  .md > :first-child { margin-top:0; } .md > :last-child { margin-bottom:0; }
  .md p, .md ul, .md ol, .md pre, .md blockquote { margin:6px 0; }
  .md h3, .md h4, .md h5, .md h6 { margin:8px 0 4px; }
  .md code { background:var(--panel); padding:0 4px; border-radius:3px; font-size:13px; }
  .md pre { background:var(--panel); padding:8px; border-radius:4px; overflow:auto; }
  .md pre code { padding:0; background:none; }
  .md blockquote { border-left:3px solid var(--line); padding-left:10px; color:var(--muted); }
  .md li.task { list-style:none; margin-left:-1.2em; }
  .md a { color:var(--accent); }
  /* attachments */
  .file { display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:4px 6px; }
  .file a { color:var(--accent); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file img { width:36px; height:36px; object-fit:cover; border-radius:3px; }
  .file .count { white-space:nowrap; }
  /* people */
  .avatar { width:20px; height:20px; border-radius:50%; background:var(--c); color:#fff; font-size:10px; font-weight:600; flex:none;
            display:inline-flex; align-items:center; justify-content:center; letter-spacing:.02em; }
  .assignee { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); min-width:0; }
  .assignee span:last-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .person-pick { display:flex; align-items:center; gap:6px; }
  .step .person-pick select { width:130px; padding:2px 4px; font-size:12px; }
  #filters .sep { width:1px; align-self:stretch; background:var(--line); margin:0 6px; }
</style>
</head>
<body>
<header>
  <h1>Phase Board</h1>
  <select id="projectSel"></select>
  <button id="newProject">+ Project</button>
  <button id="renameProject">Rename</button>
  <button id="labels">Categories &amp; tags</button>
  <button id="people">People</button>
  <button id="bin">Recently deleted (0)</button>
  <button id="undo" disabled title="Undo your last change (Ctrl+Z)">↶ Undo</button>
  <button id="delProject" class="link">Delete project</button>
  <span id="me"></span>
  <span id="status" class="offline">● Connecting…</span>
</header>
<nav id="tabs"></nav>
<div id="drag-hint" hidden></div>
<div id="menu" role="menu" hidden></div>
<div id="filters"></div>
<div id="board"></div>

<div id="modal"><div class="dialog" id="dialog"></div></div>
<div id="toast" hidden></div>

<script src="sync.js"></script>
<script src="model.js"></script>
<script src="markdown.js"></script>
<script>
// Data shape: { people: [{ id, name }], projects: [project] } (people are shared by every project)
// project { majorPhases: [{ id, name, stages: [{ id, name }] }],
//           categories: [{ id, name, color }], tags: [{ id, name, color }],
//           tasks: [{ id, stageId, categoryId, tags: [tagId], priority, size?, due? ("YYYY-MM-DD"), assigneeId?, description,
//                     steps: [{ id, name, done, assigneeId? }], attachments: [{ id, name, size, type }], orphanedFrom? }] }
// A task whose stageId matches no stage (null after a delete) is an orphan. The server enforces the rules in model.js.
// ids are generated by every client, so make collisions between users vanishingly unlikely
const uid = () => (Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 8));
// per-viewer preferences; storage can be unavailable (private windows, blocked site data)
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let state = null;
let currentId = store.get('currentProject');

// ---------- live sync ----------
// `base` is the last state the server confirmed; `state` is base plus this user's edits not yet confirmed.
// save() sends diff(base, state) as ops. Every new server state, whether from our own save or someone else's,
// is folded in with diff(base, server) applied to `state` in place, so unsent local edits and the objects an
// open dialog is holding on to survive.
let base = null, baseVersion = 0, saveTimer, sending = false, sentState = null, trashCount = 0;
function save() { checkpoint(); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 120); }
async function flush() {
  if (sending || !base) return;
  const ops = Sync.diff(base, state);

  const usedCats = new Set(p.tasks.map(t => categoryOf(p, t).id));
  const cats = group('category', p.categories.filter(c => usedCats.has(c.id)), x => x.color, 'Filter by category:', 'Category any of:', false);

function tabEl(p, m, active) {

    onclick: () => { if (!active) { setView(m.id); render(); } },
    ondragstart: e => { if (drag) return; drag = { kind: 'tab', id: m.id }; e.dataTransfer.setData('text/plain', m.name); e.dataTransfer.effectAllowed = 'move'; },
    ondragover: e => {
      if (!drag) return;
      if (drag.kind === 'tab' && drag.id !== m.id) { e.preventDefault(); markSide(tab, dropSide(e, tab, 'x')); }

      else if ((drag.kind === 'card' && m.stages.length) || (drag.kind === 'stage' && !m.stages.some(s => s.id === drag.id) && isBugs(phaseOfStage(p, drag.id)) === bugs)) {

    ondrop: e => {

      else if (d.kind === 'card') { const t = p.tasks.find(x => x.id === d.id); if (!t || !m.stages.length) return; moveTask(p, t, m.stages[0].id, null); setView(m.id); }
      else if (d.kind === 'stage') {

    !bugs && prog.all ? h('span', { class: 'tab-progress', title: `${prog.done} of ${prog.all} cards done` },

}

function orphanTabEl(p, active) {

// cards row with drop positioning; stageId null is the orphaned cards row. Stage rows also accept dragged stages.
function cardsRow(p, tasks, stageId, onStageDrop, ...head) {
  const cards = h('div', { class: 'cards' }, tasks.map(t => cardEl(p, t)));
  const row = h('div', { class: 'stage',
    ondragover: e => {
      if (drag?.kind === 'card') { e.preventDefault(); row.classList.add('over'); }
      else if (drag?.kind === 'stage' && onStageDrop) { e.preventDefault(); markSide(row, dropSide(e, row, 'y')); }
    },
    ondragleave: e => { if (!row.contains(e.relatedTarget)) row.classList.remove('over', 'drop-before', 'drop-after'); },
    ondrop: e => {
      e.preventDefault();
      const d = drag; endDrag();
      if (d?.kind === 'stage' && onStageDrop) { onStageDrop(d.id, dropSide(e, row, 'y')); return; }
      const t = d?.kind === 'card' && p.tasks.find(t => t.id === d.id);
      if (!t) return;
      // drop position: before the first card that is on a later line, or on this line with its midpoint right of the cursor
      // (skip the dragged card itself: it is removed from p.tasks in moveTask, so it can't be an anchor)
      const after = [...cards.children].find(c => {
        if (c.dataset.id === t.id) return false;
        const r = c.getBoundingClientRect();
        return e.clientY < r.top || (e.clientY < r.bottom && e.clientX < r.left + r.width / 2);
      });
      const before = after && p.tasks.find(x => x.id === after.dataset.id);
      if (stageId) moveTask(p, t, stageId, before);
      else { if (!orphansOf(p).includes(t)) orphan(p, [t], null); moveTask(p, t, t.stageId, before); }
      save(); render();
    },
  }, h('div', { class: 'stage-head' }, ...head), cards);
  return row;
}

function archivedPage(p) {

function moveTask(p, t, stageId, before) {
  p.tasks.splice(p.tasks.indexOf(t), 1);
  t.stageId = stageId;
  if (stageId) delete t.orphanedFrom;
  p.tasks.splice(before ? p.tasks.indexOf(before) : p.tasks.length, 0, t);
}
// detach tasks from their stage, remembering where they were ("Major › Stage")
function orphan(p, tasks, from) {
  for (const t of tasks) {
    const m = p.majorPhases.find(m => m.stages.some(s => s.id === t.stageId));
    t.orphanedFrom = from || (m ? `${m.name} › ${m.stages.find(s => s.id === t.stageId).name}` : t.orphanedFrom);
    t.stageId = null;
  }
}
function moveIn(a, x, d) {
  const i = a.indexOf(x), j = i + d;
  if (j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]]; save(); render();
}
function addMajor() {
  const m = { id: uid(), name: 'New phase', stages: defaultStages() }, phases = project().majorPhases;
  // new phases go before Bugs while it sits last
  const last = phases[phases.length - 1];
  phases.splice(isBugs(last) ? phases.length - 1 : phases.length, 0, m);
  setView(m.id); save(); render();
}
// stage/major phase deletion: cards are orphaned unless "Delete cards" is ticked (they then go to the bin with it)
// (cards in review keep pointing at a deleted stage; whoever approves them picks a new destination)
function delMajor(m) {
  const p = project(), ids = new Set(m.stages.map(s => s.id)), cards = p.tasks.filter(t => !t.review && ids.has(t.stageId));
  confirmDelete(`major phase "${m.name}"`, `${m.stages.length} stage(s) and ${cards.length} card(s)`, cards.length, delCards => {
    if (delCards) p.tasks = p.tasks.filter(t => !cards.includes(t)); else orphan(p, cards);
    p.majorPhases = p.majorPhases.filter(x => x !== m);
  });
}
function delStage(mp, st) {
  const p = project(), cards = p.tasks.filter(t => !t.review && t.stageId === st.id);
  confirmDelete(`${isBugs(mp) ? 'bug type' : 'stage'} "${st.name}"`, `${cards.length} card(s)`, cards.length, delCards => {
    if (delCards) p.tasks = p.tasks.filter(t => !cards.includes(t)); else orphan(p, cards);
    mp.stages = mp.stages.filter(x => x !== st);
  });
}
function addTask(st) {
  const p = project(), bug = isBugs(phaseOfStage(p, st.id));
  // bugs start as Bugfix when that category exists
  const category = (bug && p.categories.find(c => c.name.trim().toLowerCase() === 'bugfix')) || Model.defaultCategory(p);
  const t = { id: uid(), title: bug ? 'New bug' : 'New task', description: '', stageId: st.id, categoryId: category.id,
    priority: 'medium', tags: [], steps: [], attachments: [], comments: [] };
  // someone who isn't a reviewer creates cards in review, aimed at this stage; bugs skip review
  const who = me(), review = !bug && reviewMode() && !isReviewer(who);
  if (review) t.review = { status: 'pending', by: who?.id || '', byName: who?.name || 'Someone', at: new Date().toISOString() };
  p.tasks.push(t); save(); render(); openTask(t);
  if (review) toast('Card sent for review. It will appear here once a reviewer approves it.');
}

// ---------- card review ----------
// Reviewers are People with the Reviewer flag. When anyone is a reviewer, cards created by non-reviewers wait in
// the Review tab until a reviewer approves them (they then appear in their destination stage) or declines them.
// The server enforces the same rules, from the identity in the header (or Cloudflare Access).
const isReviewer = x => !!x?.reviewer;
const reviewMode = () => state.people.some(isReviewer);
// what the viewer may do with a card in review
const canReview = () => isReviewer(me());
const ownsReview = t => !!t.review && t.review.by === (me()?.id || '');
const destinationOf = (p, t) => {
  const m = p.majorPhases.find(m => m.stages.some(s => s.id === t.stageId));
  return m ? `${m.name} › ${m.stages.find(s => s.id === t.stageId).name}` : null;
};
function approve(p, t, stageId = t.stageId) {
  const stages = new Set(p.majorPhases.flatMap(m => m.stages.map(s => s.id)));
  if (!stages.has(stageId)) return chooseDestination(p, t);  // its stage was deleted in the meantime
  delete t.review;
  t.approvedBy = me()?.id || ''; t.approvedAt = new Date().toISOString();
  moveTask(p, t, stageId, null);  // at the end of its stage
  save(); render();
  toast(`Approved: "${t.title}" is now in ${destinationOf(p, t)}.`);
}
function chooseDestination(p, t) {
  syncDialog = null;
  const sel = h('select', {},
    ...p.majorPhases.filter(m => m.stages.length).map(m => h('optgroup', { label: m.name }, m.stages.map(s => h('option', { value: s.id }, s.name)))),
    h('option', { value: '' }, 'Orphaned cards'));
  showDialog(h('h2', {}, `Approve "${t.title}"`),
    h('p', {}, 'The stage it was meant for no longer exists. Where should it go?'), sel,
    buttons(h('button', { onclick: closeModal }, 'Cancel'),
      h('button', { class: 'primary', onclick: () => {
        if (sel.value) approve(p, t, sel.value);
        else { delete t.review; t.approvedBy = me()?.id || ''; t.approvedAt = new Date().toISOString(); orphan(p, [t], 'Review'); save(); }
        closeModal(); } }, 'Approve')));
}
function decline(p, t) {
  const reason = prompt(`Decline "${t.title}"? You can give a reason (optional):`, '');
  if (reason === null) return;
  t.review = { ...t.review, status: 'declined', reason: reason.trim(), declinedBy: me()?.name || '', declinedAt: new Date().toISOString() };
  save(); render();
}
function resubmit(t) {
  t.review = { status: 'pending', by: t.review.by, byName: t.review.byName, at: new Date().toISOString() };
  save(); render();
}

function reviewPage(p) {
  const cards = s => p.tasks.filter(t => t.review?.status === s);
  const row = t => {
    const r = t.review, mine = ownsReview(t), dest = destinationOf(p, t);
    return h('div', { class: 'review-row' },
      cardEl(p, t),
      h('div', { class: 'review-info' },
        h('div', {}, h('strong', {}, r.byName), ` submitted ${fmtWhen(r.at)}`),
        h('div', { class: 'count' }, 'Goes to: ', dest || h('em', {}, 'its stage was deleted; choose one when approving')),
        r.status === 'declined' ? h('div', { class: 'declined-reason' }, `Declined${r.declinedBy ? ' by ' + r.declinedBy : ''}`, r.reason ? `: ${r.reason}` : '') : null,
        h('div', { class: 'row', style: 'justify-content:flex-start;flex-wrap:wrap' },
          canReview() ? [h('button', { class: 'primary', onclick: () => approve(p, t) }, 'Approve'),
            r.status === 'pending' ? h('button', { onclick: () => decline(p, t) }, 'Decline') : null] : null,
          r.status === 'declined' && (mine || canReview()) ? h('button', { onclick: () => resubmit(t) }, 'Resubmit') : null,
          mine || canReview() ? h('button', { class: 'link', onclick: () => {
            if (confirm(`Delete "${t.title}"? It stays in Recently deleted for 30 days.`)) { p.tasks = p.tasks.filter(x => x !== t); save(); render(); } } }, mine && r.status === 'pending' ? 'Withdraw' : 'Delete') : null)));
  };
  const pending = cards('pending'), declined = cards('declined');
  return h('div', { class: 'review' },
    h('p', { class: 'hint', style: 'padding:0' }, !reviewMode() ? 'No one is a reviewer, so new cards go straight to the board. Mark reviewers under People.'
      : canReview() ? 'You are a reviewer: open a card to edit it, then approve or decline it.'
      : 'Cards you create wait here until a reviewer approves them. You can edit or withdraw your own.'),
    h('h3', {}, `Waiting for review (${pending.length})`),
    pending.length ? h('div', { class: 'list' }, pending.map(row)) : h('p', { class: 'count' }, 'Nothing waiting.'),
    declined.length ? [h('h3', {}, `Declined (${declined.length})`), h('div', { class: 'list' }, declined.map(row))] : null);
}
function newTag(p, name) {
  const tag = { id: uid(), name: name.trim().slice(0, 30), color: Model.TAG_COLORS[p.tags.length % Model.TAG_COLORS.length] };
  p.tags.push(tag);

// ---------- modal: task dialog, labels editor and delete confirmations ----------
const modal = document.getElementById('modal'), dialog = document.getElementById('dialog');
modal.addEventListener('mousedown', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
// set while a dialog is open: refreshes it when someone else changes the board
let syncDialog = null;
// set by a dialog that must do something as it goes away (e.g. keep a version of a decision being edited)
let onDialogClose = null;
const leaveDialog = () => { const f = onDialogClose; onDialogClose = null; if (f) f(); };
function closeModal() { leaveDialog(); syncDialog = null; modal.classList.remove('open'); dialog.classList.remove('files-over'); render(); }
function showDialog(...kids) {

  dialog.ondragover = dialog.ondragleave = dialog.ondrop = null;  // a task dialog sets these for file drops
  dialog.classList.remove('card-view', 'decision-view');  // and those are wider than the other dialogs

}
const buttons = (...b) => h('div', { class: 'row', style: 'justify-content:flex-end' }, ...b);

function confirmDelete(what, holds, nCards, onConfirm) {

// ---------- sections shared by the card and decision dialogs ----------
// Markdown text shown rendered; clicking it (except a link or a text selection) or Edit opens the editor.
// onEditEnd(before) runs when an editing session that changed the text ends: Preview, or the dialog closing.
function markdownField({ get, set, rows = 6, placeholder, onEditEnd }) {
  const area = h('textarea', { rows, value: get(), placeholder, oninput: e => { set(e.target.value); save(); } });
  let editing = !get(), before = get();
  const finish = () => { if (editing && onEditEnd && get() !== before) onEditEnd(before); before = get(); };
  const setEditing = on => { if (!on) finish(); editing = on; before = get(); draw(); if (on) area.focus(); };
  const preview = h('div', { class: 'md editable', title: 'Click to edit', tabIndex: 0, role: 'button',
    onclick: e => { if (!e.target.closest('a') && !String(getSelection())) setEditing(true); },
    onkeydown: e => { if (e.key === 'Enter' && !e.target.closest('a')) { e.preventDefault(); setEditing(true); } } });
  const modeBtn = h('button', { onclick: () => setEditing(!editing) });
  const draw = () => {
    preview.innerHTML = Markdown.render(get());  // Markdown.render escapes all text: safe to insert
    area.hidden = !editing; preview.hidden = editing;
    modeBtn.textContent = editing ? 'Preview' : 'Edit';
  };
  draw();
  return { area, preview, modeBtn, finish,
    refresh: () => { if (document.activeElement !== area) area.value = get(); draw(); } };
}

async function uploadFiles(owner, alive, files, status, redraw) {
  for (const f of files) {
    status.textContent = `Uploading ${f.name}…`;
    try {
      const r = await fetch('/api/files', { method: 'POST', body: f,
        headers: { 'Content-Type': f.type || 'application/octet-stream', 'X-Filename': encodeURIComponent(f.name) } });
      if (!r.ok) throw new Error(r.status === 413 ? 'the file is too large' : 'upload failed');
      const a = await r.json();
      if (!alive()) return;
      owner.attachments.push({ id: a.id, name: a.name, size: a.size, type: a.type, uploadedAt: a.uploadedAt });
      save(); redraw();
      status.textContent = '';
    } catch (err) {
      status.textContent = `Couldn't upload ${f.name}: ${err.message}.`;
      return;
    }
  }
}

// attachments of a card or decision; files can also be dropped anywhere on the dialog (see dropHandlers)
function attachmentsSection(owner, alive) {
  const list = h('div', { class: 'list' }), status = h('p', { class: 'count' });
  const picker = h('input', { type: 'file', multiple: true, hidden: true,
    onchange: e => { uploadFiles(owner, alive, [...e.target.files], status, draw); e.target.value = ''; } });
  const draw = () => {
    list.replaceChildren(...owner.attachments.map(a => {
      const href = `/files/${a.id}/${encodeURIComponent(a.name)}`;
      return h('div', { class: 'file' },
        /^image\/(png|jpeg|gif|webp)$/.test(a.type) ? h('img', { src: href, alt: '' }) : h('span', {}, '📄'),
        h('a', { href, download: a.name, title: a.name }, a.name),
        h('span', { class: 'count' }, fmtSize(a.size)),
        h('button', { class: 'link', title: 'Delete attachment', onclick: () => {
          if (!confirm(`Delete attachment "${a.name}"?`)) return;
          owner.attachments = owner.attachments.filter(x => x.id !== a.id); save(); draw(); } }, '✕'));
    }));
  };
  draw();
  const dropHandlers = {
    ondragover: e => { if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); dialog.classList.add('files-over'); } },
    ondragleave: e => { if (!dialog.contains(e.relatedTarget)) dialog.classList.remove('files-over'); },
    ondrop: e => {
      if (!e.dataTransfer.files.length) return;
      e.preventDefault(); dialog.classList.remove('files-over');
      uploadFiles(owner, alive, [...e.dataTransfer.files], status, draw);
    },
  };
  const el = h('div', {},
    h('div', { class: 'field-head' }, h('label', {}, 'Attachments'), h('button', { class: 'link', onclick: () => picker.click() }, '+ Attach files')),
    list, status, picker, h('p', { class: 'hint', style: 'padding:0' }, 'Or drop files onto this dialog.'));
  return { el, refresh: draw, dropHandlers };
}

// comments of a card or decision: anyone can read, and people edit or delete their own
function commentsSection(owner) {
  const box = h('div', { class: 'list' }), count = h('span', { class: 'count' }), hint = h('p', { class: 'hint', style: 'padding:0' });
  let editingComment = null;
  const authorOf = c => personById(c.authorId) || { id: c.authorId || 'unknown', name: c.authorName || 'Unknown' };
  const draw = () => {
    box.replaceChildren(...owner.comments.map(c => {
      const author = authorOf(c), mine = me()?.id === c.authorId, editing = editingComment === c.id;
      const head = h('div', { class: 'comment-head' }, avatar(author), h('strong', {}, author.name),
        h('span', { class: 'count' }, fmtWhen(c.at) + (c.editedAt ? ' (edited)' : '')),
        mine && !editing ? h('span', { class: 'comment-tools' },
          h('button', { class: 'link', onclick: () => { editingComment = c.id; draw(); } }, 'Edit'),
          h('button', { class: 'link', onclick: () => { if (confirm('Delete this comment?')) { owner.comments = owner.comments.filter(x => x !== c); save(); draw(); } } }, 'Delete')) : null);
      if (editing) {
        const area = h('textarea', { rows: 3, value: c.text });
        return h('div', { class: 'comment' }, head, area, buttons(
          h('button', { onclick: () => { editingComment = null; draw(); } }, 'Cancel'),
          h('button', { class: 'primary', onclick: () => {
            const text = area.value.trim();
            if (text && text !== c.text) { c.text = text; c.editedAt = new Date().toISOString(); save(); }
            editingComment = null; draw(); } }, 'Save')));
      }
      const body = h('div', { class: 'md comment-body' });
      body.innerHTML = Markdown.render(c.text);  // Markdown.render escapes all text: safe to insert
      return h('div', { class: 'comment' }, head, body);
    }));
    count.textContent = owner.comments.length ? String(owner.comments.length) : '';
    const who = me();
    postBtn.disabled = composer.disabled = !who;
    hint.textContent = who ? '' : 'Choose who you are at the top of the page to comment.';
    hint.hidden = !!who;
  };
  const post = () => {
    const text = composer.value.trim(), who = me();
    if (!text || !who) return;
    owner.comments.push({ id: uid(), authorId: who.id, authorName: who.name, text, at: new Date().toISOString() });
    composer.value = ''; save(); draw();
  };
  const composer = h('textarea', { rows: 2, placeholder: 'Write a comment (Markdown supported). Ctrl+Enter to post.',
    onkeydown: e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) post(); } });
  const postBtn = h('button', { onclick: post }, 'Comment');
  draw();
  const el = h('div', {}, h('div', { class: 'field-head' }, h('label', {}, 'Comments'), count), box, composer, hint,
    h('div', { class: 'row', style: 'justify-content:flex-end;margin-top:4px' }, postBtn));
  return { el, refresh: () => { if (!el.contains(document.activeElement)) draw(); } };
}

const fmtWhen = iso => new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
const deletedNotice = (what, name) => {
  syncDialog = null;
  showDialog(h('h2', {}, `This ${what} was deleted`), h('p', {}, `"${name}" is in Recently deleted for 30 days.`),
    buttons(h('button', { class: 'primary', onclick: closeModal }, 'Close')));
};

// one-line text that wraps and grows to fit instead of scrolling sideways; Enter commits it rather than adding a line
const grow = el => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; };
// heights can only be measured once the boxes are on screen
const growAll = root => requestAnimationFrame(() => root.querySelectorAll('textarea.wrap').forEach(grow));
window.addEventListener('resize', () => growAll(dialog));
function stepText({ class: cls = '', onkeydown, ...props }) {
  return h('textarea', { ...props, rows: 1, class: ('wrap ' + cls).trim(),
    oninput: e => grow(e.target),
    onkeydown: e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();  // no line breaks in a step
      if (onkeydown) onkeydown(e); else e.target.blur();  // blurring fires onchange, which saves
    } });
}

// p: the card's project, when it isn't the one showing (the calendar can show every project)
function openTask(t, p = project()) {
  const alive = () => state.projects.includes(p) && p.tasks.includes(t);

  // steps
  const stepsBox = h('div', { class: 'list' });
  const drawSteps = () => {
    stepsBox.replaceChildren(...t.steps.map(s =>
      h('div', { class: 'step' + (s.done ? ' done' : '') },
        h('input', { type: 'checkbox', checked: s.done, onchange: e => { s.done = e.target.checked; save(); drawSteps(); } }),
        stepText({ value: s.name, onchange: e => { s.name = e.target.value; save(); } }),
        h('span', { class: 'person-pick' }, personById(s.assigneeId) ? avatar(personById(s.assigneeId)) : null,
          personSelect(() => s.assigneeId, id => { assign(s, id); drawSteps(); })),
        // look the step up on click: someone else may have changed the list since it was drawn
        h('button', { class: 'link', onclick: () => { const i = t.steps.indexOf(s); if (i > 0) { [t.steps[i - 1], t.steps[i]] = [t.steps[i], t.steps[i - 1]]; save(); drawSteps(); } } }, '↑'),
        h('button', { class: 'link', onclick: () => { t.steps = t.steps.filter(x => x !== s); save(); drawSteps(); } }, '✕'))));
    growAll(stepsBox);
  };
  const newStep = stepText({ placeholder: 'Add a step and press Enter', class: 'new-step',
    onkeydown: e => { if (e.key === 'Enter' && e.target.value.trim()) {
      t.steps.push({ id: uid(), name: e.target.value.trim(), done: false });
      e.target.value = ''; grow(e.target); save(); drawSteps(); } } });

  // stage, category, priority, size
  // where the card is: a major phase, then one of its stages; changing the phase picks its first stage.
  // The board follows the card to wherever it is moved.
  const phaseOf = () => p.majorPhases.find(m => m.stages.some(s => s.id === t.stageId));
  const phaseSel = h('select', { onchange: e => {
      const m = p.majorPhases.find(x => x.id === e.target.value);
      moveCardTo(p, t, m ? m.stages[0].id : null); drawPlace(); showReview(); } });
  const stageSel = h('select', { onchange: e => { moveCardTo(p, t, e.target.value); drawPlace(); } });
  // bugs can be marked resolved (their types aren't progress stages)
  const resolved = h('input', { type: 'checkbox', onchange: e => { if (e.target.checked) t.resolved = true; else delete t.resolved; save(); } });
  const resolvedField = h('div', { style: 'flex:0 0 auto' }, h('label', {}, 'Bug'), h('label', { class: 'check' }, resolved, 'Resolved'));
  const drawPlace = () => {
    const here = phaseOf();
    if (document.activeElement !== phaseSel) phaseSel.replaceChildren(
      ...p.majorPhases.map(m => h('option', { value: m.id, selected: m === here, disabled: !m.stages.length }, (isBugs(m) ? '🐞 ' : '') + m.name + (m.stages.length ? '' : ' (no stages)'))),
      h('option', { value: '', selected: !here }, '— Orphaned cards —'));
    if (document.activeElement !== stageSel) stageSel.replaceChildren(...(here
      ? here.stages.map(s => h('option', { value: s.id, selected: s.id === t.stageId }, s.name))
      : [h('option', { value: '' }, '—')]));
    stageSel.disabled = !here;
    resolved.checked = !!t.resolved;
    resolvedField.hidden = !isBugs(here);
  };
  const catDot = h('span', { class: 'dot', style: 'width:12px;height:12px' });
  const catOptions = () => p.categories.map(c => h('option', { value: c.id, selected: c.id === categoryOf(p, t).id }, c.name));
  const catSel = h('select', { required: true, onchange: e => { t.categoryId = e.target.value; save(); showCat(); } }, catOptions());
  const showCat = () => { catDot.style.setProperty('--c', categoryOf(p, t).color); };
  const prio = h('select', { onchange: e => { t.priority = e.target.value; save(); } },
    Model.PRIORITIES.map(v => h('option', { value: v, selected: v === t.priority }, cap(v))));
  const size = h('select', { onchange: e => { if (e.target.value) t.size = e.target.value; else delete t.size; save(); } },
    h('option', { value: '' }, '—'), Model.SIZES.map(v => h('option', { value: v, selected: v === t.size }, cap(v))));
  // deadline: a date only; the date input reads and writes "YYYY-MM-DD", so no timezone is involved
  const due = h('input', { type: 'date', value: t.due || '', onchange: e => { setDue(t, e.target.value); save(); showDue(); } });
  const clearDue = h('button', { class: 'link', title: 'Clear due date', onclick: () => { setDue(t, ''); save(); showDue(); } }, '✕');
  const showDue = () => { if (document.activeElement !== due) due.value = t.due || ''; clearDue.hidden = !t.due; };
  const assigneeAvatar = h('span', { style: 'display:flex' });
  const showAssignee = () => { const x = personById(t.assigneeId); assigneeAvatar.replaceChildren(...(x ? [avatar(x)] : [])); };
  const assignee = personSelect(() => t.assigneeId, id => { assign(t, id); showAssignee(); });

  // tags: up to Model.MAX_TAGS; typing a new name creates a project tag
  const tagList = h('datalist', { id: 'tag-options' });
  const tagInput = h('input', { placeholder: 'Add a tag…', list: 'tag-options', maxLength: 30,
    onkeydown: e => {
      if (e.key !== 'Enter' && e.key !== ',') return;
      e.preventDefault();
      const name = tagInput.value.trim();
      if (!name || t.tags.length >= Model.MAX_TAGS) return;
      const tag = p.tags.find(x => sameName(x.name, name)) || newTag(p, name);
      if (!t.tags.includes(tag.id)) t.tags.push(tag.id);
      tagInput.value = ''; save(); drawTags();
    } });
  const tagBox = h('div', { class: 'tag-edit' }), tagCount = h('span', { class: 'count' });
  const drawTags = () => {
    const mine = t.tags.map(id => p.tags.find(x => x.id === id)).filter(Boolean);
    tagBox.replaceChildren(...mine.map(tag => tagChip(tag, h('button', { title: 'Remove tag', onclick: () => { t.tags = t.tags.filter(id => id !== tag.id); save(); drawTags(); } }, '✕'))), tagInput);
    tagList.replaceChildren(...p.tags.filter(x => !t.tags.includes(x.id)).map(x => h('option', { value: x.name })));
    const full = t.tags.length >= Model.MAX_TAGS;
    tagInput.disabled = full;
    tagInput.placeholder = full ? `Limit of ${Model.MAX_TAGS} tags reached` : 'Add a tag and press Enter…';
    tagCount.textContent = `${t.tags.length}/${Model.MAX_TAGS}`;
  };

  const title = h('input', { value: t.title, style: 'font-size:16px;font-weight:600', oninput: e => { t.title = e.target.value; save(); } });
  const desc = markdownField({ get: () => t.description, set: v => { t.description = v; },
    placeholder: 'Markdown supported: **bold**, *italic*, `code`, - lists, [links](https://…)' });
  const files = attachmentsSection(t, alive), comments = commentsSection(t);
  const from = h('p', { class: 'from' });
  const showFrom = () => { from.textContent = t.orphanedFrom ? 'Orphaned from: ' + t.orphanedFrom : ''; from.hidden = !t.orphanedFrom; };

  // decisions that link to this card, and linking another
  const decisionsBox = h('div', { class: 'list' });
  const linkDecision = h('select', { onchange: e => {
      const d = p.decisions.find(x => x.id === e.target.value);
      if (d && !d.cardIds.includes(t.id)) { d.cardIds.push(t.id); save(); }
      drawDecisions(); } });
  const drawDecisions = () => {
    const linked = decisionsFor(p, t);
    decisionsBox.replaceChildren(...linked.map(d => h('div', { class: 'item decision-link' },
      h('button', { class: 'link', style: 'flex:1;text-align:left', onclick: () => openDecision(d, p) }, decisionLabel(d)), statusChip(d),
      h('button', { class: 'link', title: 'Unlink', onclick: () => { d.cardIds = d.cardIds.filter(id => id !== t.id); save(); drawDecisions(); } }, '✕'))));
    const others = sortedDecisions(p).filter(d => !linked.includes(d));
    linkDecision.replaceChildren(h('option', { value: '' }, others.length ? '+ Link a decision…' : 'No other decisions to link'),
      ...others.map(d => h('option', { value: d.id }, decisionLabel(d))));
    linkDecision.disabled = !others.length;
  };

  const archiveBtn = h('button', { onclick: () => { setArchived(t, !t.archived); save(); closeModal(); } });
  const showArchive = () => { archiveBtn.textContent = t.archived ? 'Unarchive' : 'Archive'; };

  // a card in review: who sent it, where it will go, and the reviewer's (or creator's) actions.
  // Anyone else can read it and comment, but not change it.
  const reviewBar = h('div', { class: 'review-bar' }), phaseLabel = h('label', {}), stageLabel = h('label', {});
  const doneBtn = h('button', { class: 'primary', style: 'flex:none', onclick: closeModal }, 'Done');
  const locked = () => !!t.review && !canReview() && !ownsReview(t);
  const showReview = () => {
    const r = t.review;
    const row = isBugs(phaseOf()) ? 'type' : 'stage';
    phaseLabel.textContent = r ? 'Destination: major phase' : 'Major phase';
    stageLabel.textContent = r ? `Destination: ${row}` : cap(row);
    archiveBtn.hidden = !!r;
    reviewBar.hidden = !r;
    if (!r) return;
    reviewBar.replaceChildren(
      h('div', {}, h('strong', {}, r.status === 'pending' ? 'Waiting for review' : 'Declined'), ` · sent by ${r.byName}, ${fmtWhen(r.at)}`,
        r.status === 'declined' && r.reason ? h('div', {}, `Reason: ${r.reason}`) : null,
        locked() ? h('div', { class: 'count' }, 'Only a reviewer or the person who sent it can change it. You can still comment.') : null),
      h('div', { class: 'row', style: 'flex:none' },
        canReview() ? [h('button', { class: 'primary', onclick: () => { approve(p, t); if (!t.review) closeModal(); } }, 'Approve'),
          r.status === 'pending' ? h('button', { onclick: () => { decline(p, t); showReview(); } }, 'Decline') : null] : null,
        r.status === 'declined' && (ownsReview(t) || canReview()) ? h('button', { onclick: () => { resubmit(t); showReview(); } }, 'Resubmit') : null));
  };
  const applyLock = () => {
    const on = locked();
    for (const el of dialog.querySelectorAll('input, select, textarea, button')) {
      if (!comments.el.contains(el) && !reviewBar.contains(el) && el !== doneBtn) el.disabled = on;
    }
    desc.preview.style.pointerEvents = on ? 'none' : '';
  };

  drawSteps(); drawTags(); drawPlace(); showFrom(); showCat(); showAssignee(); showArchive(); drawDecisions(); showReview(); showDue();
  showDialog(
    reviewBar,
    title,
    h('div', { class: 'row' },
      h('div', {}, phaseLabel, phaseSel),
      h('div', {}, stageLabel, stageSel),
      h('div', {}, h('label', {}, 'Category'), h('div', { style: 'display:flex;align-items:center;gap:6px' }, catDot, catSel))),
    h('div', { class: 'row' },
      h('div', {}, h('label', {}, 'Priority'), prio),
      h('div', {}, h('label', {}, 'Size'), size),
      h('div', {}, h('label', {}, 'Due date'), h('div', { class: 'due-pick' }, due, clearDue)),
      h('div', {}, h('label', {}, 'Assignee'), h('div', { class: 'person-pick' }, assigneeAvatar, assignee)),
      resolvedField),
    from,
    h('div', {}, h('div', { class: 'field-head' }, h('label', {}, 'Tags'), tagCount), tagBox, tagList),
    h('div', {}, h('div', { class: 'field-head' }, h('label', {}, 'Description'), desc.modeBtn), desc.area, desc.preview),
    files.el,
    h('div', {}, h('label', {}, 'Steps'), stepsBox, newStep),
    h('div', {}, h('label', {}, 'Decisions'), decisionsBox, linkDecision),
    comments.el,
    h('div', { class: 'row', style: 'justify-content:space-between' },
      h('div', { class: 'row', style: 'flex:none' },
        h('button', { onclick: () => { if (confirm('Delete this task? It stays in Recently deleted for 30 days.')) { p.tasks = p.tasks.filter(x => x !== t); save(); closeModal(); } } },
          t.review && ownsReview(t) && t.review.status === 'pending' ? 'Withdraw' : 'Delete task'),
        archiveBtn),
      doneBtn));
  dialog.classList.add('card-view');
  applyLock();
  // drop handlers live on the whole dialog while it shows this task
  Object.assign(dialog, files.dropHandlers);

  // someone else changed the board: refresh every field except the one being typed in
  syncDialog = () => {
    if (!alive()) return deletedNotice('card', t.title);
    const a = document.activeElement;
    if (a !== title) title.value = t.title;
    if (a !== prio) prio.value = t.priority;
    if (a !== size) size.value = t.size || '';
    drawPlace();
    if (a !== catSel) catSel.replaceChildren(...catOptions());
    if (a !== tagInput) drawTags();
    if (!stepsBox.contains(a)) drawSteps();
    if (a !== linkDecision) drawDecisions();
    assignee.refresh(); comments.refresh(); desc.refresh(); files.refresh();
    showFrom(); showCat(); showAssignee(); showArchive(); showReview(); showDue(); applyLock();
  };
}

// ---------- decisions log ----------
// Decisions have no numbers: they are known by title and date. Data: project.decisions [{ id, title, status, date,
// deciders: [personId], summary, body, cardIds: [taskId], supersedes?: decisionId, history: [{ id, at, authorId,
// authorName, body }], comments, attachments }]
const DECISION_STATUSES = ['proposed', 'accepted', 'rejected', 'superseded'];
const DECISION_TEMPLATE = '## Context\n\n\n## Options considered\n\n\n## Decision\n\n\n## Rationale\n\n\n## Consequences / follow-ups\n\n';
// a local date as "YYYY-MM-DD"
const toDateStr = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => toDateStr(new Date());
const fmtDate = s => s ? new Date(s + 'T00:00').toLocaleDateString(undefined, { dateStyle: 'medium' }) : 'no date';
const decisionLabel = d => `${d.title || 'Untitled decision'} (${fmtDate(d.date)})`;
const statusChip = d => h('span', { class: 'badge status ' + d.status }, cap(d.status));
// oldest decision date first, then title A–Z; undated ones last
const sortedDecisions = p => [...p.decisions].sort((a, b) =>
  (a.date || '9999') < (b.date || '9999') ? -1 : (a.date || '9999') > (b.date || '9999') ? 1 : (a.title || '').localeCompare(b.title || ''));
const decisionsFor = (p, t) => sortedDecisions(p).filter(d => d.cardIds.includes(t.id));

function newDecision() {
  const p = project();
  const d = { id: uid(), title: '', status: 'proposed', date: today(), deciders: [], summary: '', body: DECISION_TEMPLATE,
    cardIds: [], history: [], comments: [], attachments: [] };
  p.decisions.push(d); save(); render(); openDecision(d);
}

const DECISION_FILTER = p => 'decisionFilter:' + p.id;
function decisionsPage(p) {
  let saved = {};
  try { saved = JSON.parse(store.get(DECISION_FILTER(p)) || '{}'); } catch {}
  const statuses = new Set(Array.isArray(saved.statuses) ? saved.statuses : []);
  const remember = () => store.set(DECISION_FILTER(p), JSON.stringify({ statuses: [...statuses], q: search.value }));
  const search = h('input', { type: 'search', placeholder: 'Search titles, summaries and text…', value: saved.q || '', style: 'flex:1;min-width:180px',
    oninput: () => { remember(); drawList(); } });
  const chips = h('div', { class: 'chips' });
  const drawChips = () => chips.replaceChildren(...DECISION_STATUSES.map(s =>
    h('button', { class: 'chip status ' + s + (statuses.has(s) ? ' on' : ' off'), 'aria-pressed': String(statuses.has(s)),
      onclick: () => { statuses.has(s) ? statuses.delete(s) : statuses.add(s); remember(); drawChips(); drawList(); } }, cap(s))));
  const list = h('div', { class: 'list' });
  const drawList = () => {
    const q = search.value.trim().toLowerCase();
    const shown = sortedDecisions(p).filter(d => (!statuses.size || statuses.has(d.status)) &&
      (!q || [d.title, d.summary, d.body].some(x => (x || '').toLowerCase().includes(q))));
    list.replaceChildren(...(shown.length ? shown.map(d => h('div', { class: 'decision-row status ' + d.status, tabIndex: 0, role: 'button',
        onclick: () => openDecision(d), onkeydown: e => { if (e.key === 'Enter') openDecision(d); } },
      h('div', { class: 'decision-main' },
        h('div', {}, h('strong', {}, d.title || 'Untitled decision'), ' ', statusChip(d)),

      : [h('p', { class: 'count' }, p.decisions.length ? 'No decisions match.' : 'No decisions yet. Record one with "+ New decision".')]));
  };

  return h('div', { class: 'decisions' },
    h('div', { class: 'decision-toolbar' }, h('button', { class: 'primary', onclick: newDecision }, '+ New decision'), search, chips),

}

function openDecision(d, p = project()) {
  const alive = () => state.projects.includes(p) && p.decisions.includes(d);
  const title = h('input', { value: d.title, placeholder: 'Decision title', style: 'font-size:18px;font-weight:600',

      const old = p.decisions.find(x => x.id === e.target.value);

      save(); drawLinks(); } });

    const add = personSelect(() => '', id => { if (id && !d.deciders.includes(id)) d.deciders.push(id); drawDeciders(); }, '+ Add person…');

  };
  const summary = h('textarea', { rows: 2, value: d.summary, placeholder: 'One or two lines: what was decided', oninput: e => { d.summary = e.target.value; save(); } });

  // the full write-up; every editing session that changes it is kept as a version
  const keepVersion = () => {
    const who = me();
    d.history.push({ id: uid(), at: new Date().toISOString(), authorId: who?.id || '', authorName: who?.name || 'Unknown', body: d.body });

  const historyBtn = h('button', { class: 'link', onclick: () => { body.finish(); openHistory(d, () => openDecision(d, p), p); } }, `History (${d.history.length})`);

  const drawCards = () => {
    const linked = d.cardIds.map(id => p.tasks.find(t => t.id === id)).filter(Boolean);
    cardsBox.replaceChildren(...linked.map(t => h('div', { class: 'item' },
      h('button', { class: 'link', style: 'flex:1;text-align:left', onclick: () => { body.finish(); openTask(t, p); } }, t.title + (t.archived ? ' (archived)' : '')),
      h('button', { class: 'link', title: 'Unlink', onclick: () => { d.cardIds = d.cardIds.filter(id => id !== t.id); save(); drawCards(); } }, '✕'))));
    if (document.activeElement === linkCard) return;
    const free = p.tasks.filter(t => !d.cardIds.includes(t.id));
    linkCard.replaceChildren(h('option', { value: '' }, free.length ? '+ Link a card…' : 'No cards to link'),

    banner,

      h('div', {}, h('label', {}, 'Decided by'), decidersBox)),

    h('div', {}, h('div', { class: 'field-head' }, h('label', {}, 'Write-up'), h('span', {}, historyBtn, ' ', body.modeBtn)), body.area, body.preview),
    h('div', { class: 'row', style: 'align-items:flex-start' },

      h('button', { class: 'primary', style: 'flex:none', onclick: closeModal }, 'Done')));
  dialog.classList.add('decision-view');
  Object.assign(dialog, files.dropHandlers);
  onDialogClose = body.finish;

  syncDialog = () => {
    if (!alive()) return deletedNotice('decision', d.title || 'Untitled decision');
    const a = document.activeElement;
    if (a !== title) title.value = d.title;
    if (a !== status) status.value = d.status;
    if (a !== date) date.value = d.date || '';
    if (a !== summary) summary.value = d.summary;
    if (!decidersBox.contains(a)) drawDeciders();
    historyBtn.textContent = `History (${d.history.length})`;
    drawLinks(); drawCards(); body.refresh(); files.refresh(); comments.refresh();
  };
}

// earlier versions of a decision's write-up, newest first; restoring keeps the current text as a version too
function openHistory(d, back, p = project()) {
  const draw = () => {
    if (!p.decisions.includes(d)) return deletedNotice('decision', d.title);
    showDialog(
      h('h2', {}, `History: ${decisionLabel(d)}`),
      h('p', { class: 'hint', style: 'padding:0' }, 'A version is kept each time someone finishes editing the write-up.'),
      d.history.length ? h('div', { class: 'list' }, [...d.history].reverse().map(v => {
        const text = h('div', { class: 'md', hidden: true });
        text.innerHTML = Markdown.render(v.body);  // Markdown.render escapes all text: safe to insert
        const current = v.body === d.body;
        return h('div', { class: 'comment' },
          h('div', { class: 'comment-head' }, h('strong', {}, v.authorName), h('span', { class: 'count' }, fmtWhen(v.at) + (current ? ' (current text)' : '')),
            h('span', { class: 'comment-tools' },
              h('button', { class: 'link', onclick: e => { text.hidden = !text.hidden; e.target.textContent = text.hidden ? 'View' : 'Hide'; } }, 'View'),
              current ? null : h('button', { class: 'link', onclick: () => {
                if (!confirm('Replace the current write-up with this version? The current text is kept in the history.')) return;
                const who = me();
                if (d.history[d.history.length - 1]?.body !== d.body) {
                  d.history.push({ id: uid(), at: new Date().toISOString(), authorId: who?.id || '', authorName: who?.name || 'Unknown', body: d.body });
                }
                d.body = v.body;
                d.history.push({ id: uid(), at: new Date().toISOString(), authorId: who?.id || '', authorName: `${who?.name || 'Unknown'} (restored a version)`, body: v.body });
                save(); back(); } }, 'Restore'))),
          text);
      })) : h('p', { class: 'count' }, 'No versions yet.'),
      buttons(h('button', { onclick: back }, 'Back'), h('button', { class: 'primary', onclick: closeModal }, 'Done')));
    dialog.classList.add('decision-view');
  };
  syncDialog = draw;
  draw();
}

// ---------- deadlines ----------
// t.due is a calendar date, "YYYY-MM-DD", with no time of day: it is the same date wherever the viewer is, and is
// compared with the viewer's own date today.
const dateParts = s => s.split('-').map(Number);
const addDays = (s, n) => { const [y, m, d] = dateParts(s); return toDateStr(new Date(y, m - 1, d + n)); };
const daysUntil = s => { const [y, m, d] = dateParts(s), [Y, M, D] = dateParts(today()); return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(Y, M - 1, D)) / 86400e3); };
const fmtDay = (s, opts) => { const [y, m, d] = dateParts(s); return new Date(y, m - 1, d).toLocaleDateString(undefined, { ...opts, ...(y !== new Date().getFullYear() ? { year: 'numeric' } : {}) }); };
const setDue = (t, s) => { if (Model.validDate(s)) t.due = s; else delete t.due; };
// finished cards are never overdue: in a done stage, resolved bugs and archived cards
const finished = (p, t) => !!(t.archived || t.resolved || p.majorPhases.some(m => m.stages.some(s => s.id === t.stageId && s.done)));
// '' | 'soon' (today or within 2 days) | 'overdue'
const dueState = (p, t) => {
  if (!t.due || finished(p, t)) return '';
  const n = daysUntil(t.due);
  return n < 0 ? 'overdue' : n <= 2 ? 'soon' : '';
};
const dueText = s => { const n = daysUntil(s); return n === 0 ? 'today' : n === 1 ? 'tomorrow' : n === -1 ? 'yesterday' : n < 0 ? `${-n} days ago` : `in ${n} days`; };
const dueBadge = (p, t) => t.due ? h('span', { class: 'badge due ' + dueState(p, t),
  title: `Due ${fmtDay(t.due, { weekday: 'long', month: 'long', day: 'numeric' })} (${dueText(t.due)})${dueState(p, t) === 'overdue' ? ': overdue' : ''}` }, 'Due ' + fmtDay(t.due, { month: 'short', day: 'numeric' })) : null;
// "overdue" and "due soon" depend on today's date, so redraw when it changes
let shownDay = today();
setInterval(() => { if (today() !== shownDay) { shownDay = today(); if (state) renderSoon(); } }, 60e3);

// ---------- calendar ----------
// Cards by due date: a month grid (weeks start on Monday) or an agenda list. Cards in review and archived cards aren't
// shown, nor finished ones unless "Show completed" is ticked. These choices, and whether to show every project, are
// per viewer. The board filters apply; in other projects they match categories and tags of the same name.
const CAL_PREFS = 'calendar';
const calPrefs = () => {
  let x = {};
  try { x = JSON.parse(store.get(CAL_PREFS) || '{}') || {}; } catch {}
  return { view: x.view === 'agenda' ? 'agenda' : 'month', all: x.all === true, done: x.done === true };
};
const setCalPrefs = patch => { store.set(CAL_PREFS, JSON.stringify({ ...calPrefs(), ...patch })); render(); };
let calMonth = null;  // the month shown, as its first day "YYYY-MM-01"; starts at this month
const calExpanded = new Set();  // days showing all their cards rather than "+N more"

function calendarItems(p, prefs) {
  const lower = s => s.trim().toLowerCase();
  const names = (kind, list) => new Set(activeFilter(p, kind).map(id => lower(list.find(x => x.id === id).name)));
  const cats = names('category', p.categories), tags = names('tag', p.tags), people = activeFilter(p, 'person');
  const matches = (q, t) => (!cats.size || cats.has(lower(categoryOf(q, t).name))) &&
    (!tags.size || t.tags.some(id => { const g = q.tags.find(x => x.id === id); return g && tags.has(lower(g.name)); })) &&
    (!people.length || peopleOn(t).some(id => people.includes(id)));
  return (prefs.all ? state.projects : [p]).flatMap(q => q.tasks
    .filter(t => onBoard(t) && (prefs.done || !finished(q, t)) && matches(q, t))
    .map(t => ({ p: q, t })))
    // by due date, then title; no due date last
    .sort((a, b) => { const x = a.t.due || '~', y = b.t.due || '~'; return x < y ? -1 : x > y ? 1 : (a.t.title || '').localeCompare(b.t.title || ''); });
}
const placeOf = (q, t) => destinationOf(q, t) || 'Orphaned cards';

function calendarPage(p) {
  const prefs = calPrefs(), items = calendarItems(p, prefs);
  const seg = (v, label) => h('button', { class: prefs.view === v ? 'on' : '', 'aria-pressed': String(prefs.view === v), onclick: () => setCalPrefs({ view: v }) }, label);
  const check = (key, label, title) => h('label', { class: 'check-inline', title }, h('input', { type: 'checkbox', checked: prefs[key], onchange: e => setCalPrefs({ [key]: e.target.checked }) }), label);
  const month = calMonth || today().slice(0, 8) + '01';
  const goMonth = n => { const [y, m] = dateParts(month); calMonth = toDateStr(new Date(y, m - 1 + n, 1)); render(); };
  return h('div', { class: 'calendar' },
    h('div', { class: 'cal-toolbar' },
      h('span', { class: 'seg' }, seg('month', 'Month'), seg('agenda', 'Agenda')),
      prefs.view === 'month' ? [
        h('button', { title: 'Previous month', onclick: () => goMonth(-1) }, '‹'),
        h('button', { onclick: () => { calMonth = null; render(); } }, 'Today'),
        h('button', { title: 'Next month', onclick: () => goMonth(1) }, '›'),
        h('span', { class: 'month' }, fmtDay(month, { month: 'long', year: 'numeric' }))] : null,
      h('span', { style: 'flex:1' }),
      check('all', 'All projects', 'Show cards from every project'),
      check('done', 'Show completed', 'Also show cards in done stages and resolved bugs')),
    prefs.view === 'month' ? monthView(month, items, prefs) : agendaView(items, prefs));
}

function monthView(month, items, prefs) {
  const [y, m] = dateParts(month), lead = (new Date(y, m - 1, 1).getDay() + 6) % 7, days = new Date(y, m, 0).getDate();
  const start = addDays(month, -lead), now = today(), byDay = new Map();
  for (const x of items) if (x.t.due) byDay.set(x.t.due, [...(byDay.get(x.t.due) || []), x]);
  const MAX = 3;
  const chip = ({ p: q, t }) => {
    const el = h('div', { class: 'cal-chip ' + dueState(q, t) + (finished(q, t) ? ' finished' : ''), draggable: true, style: '--c:' + categoryOf(q, t).color,
      title: `${t.title}\n${prefs.all ? q.name + ' › ' : ''}${placeOf(q, t)}\nDrag to another day to change its due date`,
      onclick: () => openTask(t, q),
      ondragstart: e => { drag = { kind: 'due', id: t.id, projectId: q.id }; e.dataTransfer.setData('text/plain', t.title); e.dataTransfer.effectAllowed = 'move'; el.classList.add('dragging'); } },
      t.title || 'Untitled');
    return el;
  };
  const cell = ds => {
    const all = byDay.get(ds) || [], open = calExpanded.has(ds) || all.length <= MAX + 1;
    const el = h('div', { class: 'cal-day' + (ds.slice(0, 7) === month.slice(0, 7) ? '' : ' other') + (ds === now ? ' today' : ''),
      ondragover: e => { if (drag?.kind === 'due') { e.preventDefault(); el.classList.add('over'); } },
      ondragleave: e => { if (!el.contains(e.relatedTarget)) el.classList.remove('over'); },
      ondrop: e => {
        e.preventDefault();
        const d = drag; endDrag();
        const t = d?.kind === 'due' && state.projects.find(q => q.id === d.projectId)?.tasks.find(x => x.id === d.id);
        if (t && t.due !== ds) { t.due = ds; save(); render(); }
      } },
      h('span', { class: 'num', title: fmtDay(ds, { weekday: 'long', month: 'long', day: 'numeric' }) }, Number(ds.slice(8))),
      (open ? all : all.slice(0, MAX)).map(chip),
      all.length > MAX + 1 ? h('button', { class: 'link', onclick: () => { calExpanded.has(ds) ? calExpanded.delete(ds) : calExpanded.add(ds); render(); } },
        calExpanded.has(ds) ? 'Show less' : `+${all.length - MAX} more`) : null);
    return el;
  };
  const weekdays = [...Array(7)].map((_, i) => new Date(2024, 0, 1 + i).toLocaleDateString(undefined, { weekday: 'short' }));  // 1 Jan 2024 was a Monday
  const undated = items.filter(x => !x.t.due).length;
  return h('div', {},
    h('div', { class: 'cal-scroll' }, h('div', { class: 'cal-grid' },
      weekdays.map(w => h('div', { class: 'cal-head' }, w)),
      [...Array(Math.ceil((lead + days) / 7) * 7)].map((_, i) => cell(addDays(start, i))))),
    h('p', { class: 'hint', style: 'padding:6px 0 0' }, 'Click a card to open it, or drag it to another day to change its due date.' +
      (undated ? ` ${undated} card${undated === 1 ? ' has' : 's have'} no due date (see Agenda).` : '')));
}

function agendaView(items, prefs) {
  const now = today(), groups = new Map();
  const heading = ({ p: q, t }) => !t.due ? 'No due date' : t.due < now && !finished(q, t) ? 'Overdue' : t.due === now ? 'Today' :
    daysUntil(t.due) === 1 ? 'Tomorrow' : fmtDay(t.due, { weekday: 'long', month: 'long', day: 'numeric' });
  for (const x of items) { const k = heading(x); groups.set(k, [...(groups.get(k) || []), x]); }
  // overdue first; the rest are already in date order, with "No due date" last
  const order = [...groups.keys()].sort((a, b) => (b === 'Overdue') - (a === 'Overdue'));
  const row = ({ p: q, t }) => {
    const cat = categoryOf(q, t), who = personById(t.assigneeId);
    return h('div', { class: 'agenda-row' + (finished(q, t) ? ' finished' : ''), style: '--cat:' + cat.color, tabIndex: 0, role: 'button',
        onclick: () => openTask(t, q), onkeydown: e => { if (e.key === 'Enter') openTask(t, q); } },
      h('div', { class: 'agenda-main' }, h('strong', {}, t.title || 'Untitled'),
        h('div', { class: 'count' }, (prefs.all ? q.name + ' › ' : '') + placeOf(q, t))),
      h('span', { class: 'cat' }, h('span', { class: 'dot', style: '--c:' + cat.color }), cat.name),
      who ? h('span', { class: 'assignee' }, avatar(who), h('span', {}, who.name)) : null,
      h('span', { class: 'meta' },
        t.resolved ? h('span', { class: 'badge resolved-badge' }, '✓ Resolved') : null,
        h('span', { class: 'badge prio ' + t.priority, title: 'Priority' }, 'P: ' + cap(t.priority)),
        dueBadge(q, t)));
  };
  return h('div', { class: 'agenda' },
    items.length ? order.flatMap(k => [h('h3', { class: k === 'Overdue' ? 'overdue' : '' }, `${k} (${groups.get(k).length})`), h('div', { class: 'list' }, groups.get(k).map(row))])
      : h('p', { class: 'count' }, 'No cards to show.'));
}

// ---------- recently deleted bin ----------
function openBin() {
  const kinds = { task: 'Card', stage: 'Stage', major: 'Major phase', project: 'Project', attachment: 'Attachment', decision: 'Decision' };
  const status = h('p', { class: 'count' });
  const act = async (url, method) => {
    const r = await fetch(url, { method }).catch(() => null);
    if (!r) { status.textContent = 'Couldn’t reach the server.'; return; }
    if (!r.ok) { status.textContent = await r.text(); return; }
    status.textContent = '';
    receive(await r.json());
  };
  const draw = async () => {
    const list = await fetch('/api/trash').then(r => r.json()).catch(() => null);
    if (syncDialog !== draw) return;  // closed, or replaced by another dialog, while waiting
    const p = project();
    const shown = (list || []).filter(e => e.kind === 'project' || e.projectId === p?.id);
    showDialog(
      h('h2', {}, 'Recently deleted'),
      h('p', { class: 'hint', style: 'padding:0' }, `Deleted cards, stages and major phases in ${p ? `"${p.name}"` : 'this project'}, and deleted projects. Each stays here until the date shown, then it and its attachments are gone for good.`),
      list === null ? h('p', { class: 'count' }, 'Couldn’t load the bin.') :
      shown.length ? h('div', { class: 'list' }, shown.map(e => h('div', { class: 'item bin-item', 'data-id': e.id },
        h('div', { class: 'bin-text' },
          h('div', {}, h('strong', {}, e.name), ` (${kinds[e.kind]})`),
          h('div', { class: 'count' }, [e.from && (e.kind === 'decision' ? `decided ${fmtDate(e.from)}` : `from ${e.from}`), e.cards && `${e.cards} card(s)`,
            `deleted ${new Date(e.deletedAt).toLocaleDateString()}`, `kept until ${new Date(e.expiresAt).toLocaleDateString()}`].filter(Boolean).join(' · '))),
        h('button', { onclick: () => act(`/api/trash/${e.id}/restore`, 'POST') }, 'Restore'),
        h('button', { class: 'link', onclick: () => { if (confirm(`Permanently delete "${e.name}"? This can’t be undone.`)) act(`/api/trash/${e.id}`, 'DELETE'); } }, 'Delete forever')))) :
      h('p', { class: 'count' }, 'Nothing here.'),
      status,
      buttons(h('button', { class: 'primary', onclick: closeModal }, 'Done')));
  };
  syncDialog = draw;
  draw();
}
// ---------- categories & tags editor ----------
